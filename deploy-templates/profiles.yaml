# Agent profiles of krci-agent-dispatcher: the dispatcher side of each profile, the project mapping and the default
# profile. Embedded verbatim into the ConfigMap <release>-profiles unless profiles.existingConfigMap is set.
# Read at each actor create; a change applies to new sessions. Check: krci-agent-dispatcher check-profiles <file>.
# Rules: docs/agent-harness.md, section Agent profile.
profiles:
  go:
    # Image side (setup, verify, prompt): /etc/krci-agent/profile.yaml in the image.
    image: epamedp/krci-agent-go:0.2.0@sha256:6b1f9a1edca599ea02e1620e2ae2d924782758140e9d48810c083dfa74431176
    # TLS passthrough on 443. proxy.golang.org redirects module zips to storage.googleapis.com.
    egress:
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
    env:
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
  python:
    # Image side (setup, verify, prompt): /etc/krci-agent/profile.yaml in the image.
    image: epamedp/krci-agent-python:0.2.0@sha256:7cfe9b539727337a7752e62c8d4ef045d133e3043ed54d56dd21c0502f8ad30a
    # TLS passthrough on 443. pypi.org serves the index, files.pythonhosted.org the packages.
    egress:
      - pypi.org
      - files.pythonhosted.org
  node:
    # Image side (setup, verify, prompt): /etc/krci-agent/profile.yaml in the image.
    image: epamedp/krci-agent-node:0.2.0@sha256:e9ebe9a56bc9809b7d207aeb82c2062423ee52dc0bb30c01788e3b258df62299
    # TLS passthrough on 443. registry.npmjs.org serves the metadata and the tarballs.
    egress:
      - registry.npmjs.org
    # Overrides a registry set in the project .npmrc: egress allows only registry.npmjs.org.
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
# GitLab project path (<group>/<project>, subgroups included) → profile name; matched case-insensitively.
# To map projects, replace {} with entries such as:
projects: {}
#   krci/python-app: python
#   krci/node-app: node
#   krci/backend/payments-api: python

# Profile of every project not listed in projects.
defaultProfile: go
