{{- if .Values.ingress.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "krci-agent-dispatcher.fullname" . }}
  labels:
    {{- include "krci-agent-dispatcher.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tls.secretName }}
  dnsNames:
    - {{ required "ingress.host is required when ingress.enabled" .Values.ingress.host | quote }}
  issuerRef:
    kind: {{ .Values.ingress.tls.issuerRef.kind }}
    name: {{ required "ingress.tls.issuerRef.name is required when ingress.enabled" .Values.ingress.tls.issuerRef.name }}
    group: cert-manager.io
{{- end }}
