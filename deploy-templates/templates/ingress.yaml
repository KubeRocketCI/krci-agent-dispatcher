{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "krci-agent-dispatcher.fullname" . }}
  labels:
    {{- include "krci-agent-dispatcher.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          # Only the hook endpoint is exposed.
          - path: /hook
            pathType: Exact
            backend:
              service:
                name: {{ include "krci-agent-dispatcher.fullname" . }}
                port:
                  name: http
{{- end }}
