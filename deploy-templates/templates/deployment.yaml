apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "krci-agent-dispatcher.fullname" . }}
  labels:
    {{- include "krci-agent-dispatcher.labels" . | nindent 4 }}
spec:
  # One dispatcher at a time: two would run two activations for one issue.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "krci-agent-dispatcher.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "krci-agent-dispatcher.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "krci-agent-dispatcher.fullname" . }}
      automountServiceAccountToken: false
      # Above the longest lane drain: two GitLab write budgets in a row (2 x 60 s), plus 15 s.
      # HTTP shutdown (30 s) runs at the same time.
      terminationGracePeriodSeconds: 135
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: {{ include "krci-agent-dispatcher.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GITLAB_URL
              value: {{ required "gitlab.url is required" .Values.gitlab.url | quote }}
            # Read on each request: a rotated Secret takes effect without a restart.
            - name: GITLAB_TOKEN_FILE
              value: /var/run/gitlab/token
            {{- if .Values.gitlab.caConfigMap }}
            - name: GITLAB_CA_FILE
              value: /etc/gitlab-ca/ca.crt
            {{- end }}
            - name: HOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.hook }}
                  key: token
            - name: BOT_USERNAME
              value: {{ .Values.config.botUsername | quote }}
            - name: TRIGGER_MIN_ROLE
              value: {{ .Values.config.triggerMinRole | quote }}
            - name: ATE_API_ADDR
              value: {{ .Values.substrate.addr | quote }}
            - name: ATE_TOKEN_FILE
              value: /var/run/ate/token
            - name: ATE_CA_FILE
              value: /var/run/ate/ca.crt
            - name: ATESPACE
              value: {{ default .Release.Namespace .Values.substrate.atespace | quote }}
            {{- with .Values.substrate.workerSelector }}
            {{- $pairs := list }}
            {{- range $k, $v := . }}
            {{- if or (not (kindIs "string" $v)) (eq $v "") }}
            {{- fail (printf "substrate.workerSelector.%s must be a non-empty string: quote numbers and booleans" $k) }}
            {{- end }}
            {{- $pairs = append $pairs (printf "%s=%s" $k $v) }}
            {{- end }}
            - name: WORKER_SELECTOR
              value: {{ join "," $pairs | quote }}
            {{- end }}
            - name: SECRETS_NAMESPACE
              value: {{ default .Release.Namespace .Values.substrate.secretsNamespace | quote }}
            - name: PROFILES_FILE
              value: /etc/krci-agent-dispatcher/profiles.yaml
            - name: HARNESS_IMAGE
              value: {{ include "krci-agent-dispatcher.pinnedImage" (list . "harnessImage") | quote }}
            - name: HARNESS_POLL_INTERVAL
              value: {{ .Values.config.harnessPollInterval | quote }}
            - name: AGENT_STEPS
              value: {{ .Values.config.agentSteps | quote }}
            - name: AGENT_MODEL
              value: {{ .Values.config.agentModel | quote }}
            - name: TURN_TIMEOUT
              value: {{ .Values.config.turnTimeout | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.config.pollInterval | quote }}
            - name: SWEEP_INTERVAL
              value: {{ .Values.config.sweepInterval | quote }}
            - name: TURN_LIMIT
              value: {{ .Values.config.turnLimit | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: ate
              mountPath: /var/run/ate
              readOnly: true
            - name: gitlab-token
              mountPath: /var/run/gitlab
              readOnly: true
            # No subPath: the kubelet updates a directory mount in place.
            - name: profiles
              mountPath: /etc/krci-agent-dispatcher
              readOnly: true
            {{- if .Values.gitlab.caConfigMap }}
            - name: gitlab-ca
              mountPath: /etc/gitlab-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: ate
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: {{ .Values.substrate.trustBundleSigner }}
                  labelSelector:
                    matchLabels:
                      {{- toYaml .Values.substrate.trustBundleLabels | nindent 22 }}
                  path: ca.crt
              - serviceAccountToken:
                  audience: {{ .Values.substrate.tokenAudience }}
                  expirationSeconds: 3600
                  path: token
        - name: gitlab-token
          secret:
            secretName: {{ .Values.secrets.gitlab }}
            items:
              - key: token
                path: token
        - name: profiles
          configMap:
            name: {{ .Values.profiles.existingConfigMap | default (printf "%s-profiles" (include "krci-agent-dispatcher.fullname" .)) }}
            items:
              - key: profiles.yaml
                path: profiles.yaml
        {{- if .Values.gitlab.caConfigMap }}
        - name: gitlab-ca
          configMap:
            name: {{ .Values.gitlab.caConfigMap }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
