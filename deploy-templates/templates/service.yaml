apiVersion: v1
kind: Service
metadata:
  name: {{ include "krci-agent-dispatcher.fullname" . }}
  labels:
    {{- include "krci-agent-dispatcher.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "krci-agent-dispatcher.selectorLabels" . | nindent 4 }}
