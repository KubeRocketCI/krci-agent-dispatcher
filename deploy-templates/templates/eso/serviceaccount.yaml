{{- if and .Values.eso.enabled (has .Values.eso.provider (list "aws" "vault")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "krci-agent-dispatcher.eso.serviceAccount" . }}
  labels:
    {{- include "krci-agent-dispatcher.labels" . | nindent 4 }}
  {{- if eq .Values.eso.provider "aws" }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "eso.aws.roleArn is required when eso.provider is aws" .Values.eso.aws.roleArn | quote }}
  {{- end }}
{{- end }}
