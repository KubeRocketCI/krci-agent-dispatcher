{{- if .Values.eso.enabled }}
{{- include "krci-agent-dispatcher.eso.validate" . }}
apiVersion: {{ .Values.eso.apiVersion }}
kind: SecretStore
metadata:
  name: {{ include "krci-agent-dispatcher.fullname" . }}
  labels:
    {{- include "krci-agent-dispatcher.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq .Values.eso.provider "aws" }}
    aws:
      service: ParameterStore
      region: {{ required "eso.aws.region is required when eso.provider is aws" .Values.eso.aws.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "krci-agent-dispatcher.eso.serviceAccount" . }}
    {{- else if eq .Values.eso.provider "vault" }}
    vault:
      server: {{ required "eso.vault.server is required when eso.provider is vault" .Values.eso.vault.server | quote }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.eso.vault.mountPath | quote }}
          role: {{ .Values.eso.vault.role | quote }}
          serviceAccountRef:
            name: {{ include "krci-agent-dispatcher.eso.serviceAccount" . }}
    {{- else }}
    {{- toYaml .Values.eso.generic.secretStore.providerConfig | nindent 4 }}
    {{- end }}
{{- end }}
