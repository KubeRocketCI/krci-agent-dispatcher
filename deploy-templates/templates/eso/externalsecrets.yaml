{{- if .Values.eso.enabled }}
{{- $eso := include "krci-agent-dispatcher.eso.secrets" . | fromYaml }}
{{- range $eso.secrets }}
{{- $path := get $.Values.eso.secretPath .scope }}
---
apiVersion: {{ $.Values.eso.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "krci-agent-dispatcher.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ include "krci-agent-dispatcher.fullname" $ }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- if or .labels .template }}
    template:
      engineVersion: v2
      mergePolicy: Replace
      {{- with .labels }}
      metadata:
        labels:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .template }}
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  data:
    {{- range .data }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ $path | quote }}
        property: {{ .property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end }}
