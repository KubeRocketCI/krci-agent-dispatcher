# -- Overrides the chart name.
nameOverride: ""
# -- Overrides the full name.
fullnameOverride: ""

image:
  # -- Dispatcher image repository.
  repository: epamedp/krci-agent-dispatcher
  # -- Image tag. Empty: the chart appVersion.
  tag: ""
  # -- Image digest (sha256:...); takes precedence over image.tag.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets.
imagePullSecrets: []

profiles:
  # -- ConfigMap with key profiles.yaml: the agent profiles (agent image, egress, env per profile, project mapping,
  # default profile). Empty: the chart's deploy-templates/profiles.yaml, embedded verbatim. Read at each actor create;
  # a change needs no restart and applies to new sessions.
  existingConfigMap: ""

# -- Harness image mounted into every issue actor at /opt/krci-agent: `<repo>[:<tag>]@sha256:<digest>`. Default: the
# last harness verified with this chart; bump it with each verified release. Override for a local build.
harnessImage: "epamedp/krci-agent-harness:0.1.0-SNAPSHOT.37@sha256:42be0e0f7dd47cf60efceb5d847666dc2f388e58b968be65bd6006eb03c7cca8"

gitlab:
  # -- GitLab base URL: `https://HOST[:PORT][/PATH]`, for example https://gitlab.example.com. No user info, query or fragment. Trailing slash allowed. Required.
  url: ""
  # -- ConfigMap with key ca.crt: extra CA bundle for GitLab TLS. Empty: system roots.
  caConfigMap: ""

# Secrets (chart README, section Secrets), all in the release namespace. Dispatcher credentials: `<fullname>` (keys
# gitlab-token, hook-token). Actor credentials: `gitlab` (keys token, basic) and `anthropic` (key api-key), label
# `app.edp.epam.com/actor-credential: "true"`.
eso:
  # -- Create the dispatcher and actor credentials with the External Secrets Operator (ESO): one SecretStore, one
  # ExternalSecret per Secret. false: create the Secrets by hand.
  enabled: false
  # -- SecretStore provider: `aws` (Parameter Store), `generic` or `vault`.
  provider: "aws"
  # -- API version of the SecretStore and ExternalSecret objects. ESO 0.16 and 2.x serve `external-secrets.io/v1`.
  apiVersion: "external-secrets.io/v1"
  # One provider secret per credential scope, a JSON object each. One bot user: the two `gitlab-token` values are
  # equal. Vault: each path starts with `secret/`.
  secretPath:
    # -- Dispatcher scope: `gitlab-token` (GitLab token of the dispatcher's bot user), `hook-token` (GitLab hook
    # secret token).
    dispatcher: "/infra/core/addons/krci-agent-dispatcher/dispatcher"
    # -- Actor scope: `gitlab-token` (GitLab token of the agent's bot user), `anthropic-api-key` (Anthropic API key).
    actor: "/infra/core/addons/krci-agent-dispatcher/actor"
  # Vault configuration (if provider is `vault`).
  vault:
    # -- Vault server URL.
    server: "http://vault.vault:8200"
    # -- Mount path of the Kubernetes auth method.
    mountPath: "core"
    # -- Vault role of the Kubernetes auth method.
    role: krci-agent-dispatcher
  # AWS configuration (if provider is `aws`).
  aws:
    # -- AWS region.
    region: "eu-central-1"
    # -- IAM role of the ESO ServiceAccount `externalsecrets-<fullname>-aws` (IRSA): ssm:GetParameter on the two
    # eso.secretPath parameters, kms:Decrypt of their key for a SecureString.
    roleArn: "arn:aws:iam::012345678910:role/AWSIRSA_Shared_ExternalSecretOperatorAccess"
  generic:
    secretStore:
      # -- SecretStore `spec.provider` (if provider is `generic`). Required.
      providerConfig: {}
      #  gcpsm:
      #    projectID: "alphabet-123"

substrate:
  # -- Substrate API address.
  addr: api.ate-system.svc:443
  # -- ServiceAccount token audience of the Substrate API.
  tokenAudience: api.ate-system.svc
  # -- ClusterTrustBundle signer of the Substrate API serving certificate.
  trustBundleSigner: servicedns.podcert.ate.dev/identity
  # -- ClusterTrustBundle label selector.
  trustBundleLabels:
    podcert.ate.dev/canarying: live
  # -- Atespace of the issue actors. Empty: the release namespace. One dispatcher per atespace: the dispatcher owns
  # every actor named `issue-<project-id>-<iid>` in it.
  atespace: ""
  # -- Worker selector of the actor template: match labels, key to value. A worker hosts agent actors only when every
  # key equals its worker label, the `metadata.labels` of its WorkerPool; the WorkerPool name is not matched. Kubernetes
  # label syntax; every value a non-empty string, numbers and booleans quoted (`--set-string` on the command line). Empty: `workload: workers`.
  workerSelector: {}
    # workload: krci-agents
    # kubernetes.io/arch: amd64
    # tier: "2"

config:
  # -- Dispatcher wait for one turn's marker, whole seconds. The harness cuts a turn at turnTimeout minus
  # harnessPollInterval minus 60s.
  turnTimeout: 15m
  # -- Marker poll interval.
  pollInterval: 10s
  # -- Note poll interval of the harness in each actor, whole seconds. turnTimeout must be at least this plus 2m.
  harnessPollInterval: 15s
  # -- Agent steps per turn: the Claude Code `--max-turns` of one agent run.
  agentSteps: 40
  # -- Claude model of the agent runs.
  agentModel: claude-haiku-5-5
  # -- Time between sweeps over actors without an issue lane. 0 turns the sweep off.
  sweepInterval: 5m
  # -- Turn limit per issue.
  turnLimit: 20
  # -- Trigger role: lowest GitLab project role that can start the agent and write trigger comments: developer, maintainer or owner.
  triggerMinRole: developer

ingress:
  # -- Expose POST /hook through an Ingress with a cert-manager Certificate.
  enabled: true
  # -- Ingress class.
  className: nginx
  # -- Hook host name. Required when ingress.enabled.
  host: ""
  # -- Extra Ingress annotations.
  annotations: {}
  tls:
    # -- TLS on the Ingress: a cert-manager Certificate and the Ingress `tls` block. false: neither; TLS ends in
    # front of the ingress controller, for example a load balancer.
    enabled: true
    # -- Secret of the Ingress certificate.
    secretName: krci-agent-dispatcher-tls
    issuerRef:
      # -- cert-manager issuer kind (Issuer or ClusterIssuer).
      kind: ClusterIssuer
      # -- cert-manager issuer name. Required when ingress.enabled and ingress.tls.enabled.
      name: ""

serviceAccount:
  # -- Annotations of the ServiceAccount. Its name is the full name: the Substrate access policy member.
  annotations: {}

service:
  # -- Service port.
  port: 8080

# -- Pod annotations.
podAnnotations: {}

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
